# REBSYN-LAB Security Baseline - Part 2 (logging & cryptography)
baseline: REBSYN-BASELINE-2026.1
controls:
  BC-06: {name: audit_logging_level, require: "info-all"}
  BC-07: {name: log_retention_days, require: 90}
  BC-08: {name: tls_min_version, require: "1.3"}
  BC-09: {name: crypto_cipher_suites, require: "REBSYN-AES-GCM-2024"}
  BC-10: {name: key_rotation_days, require: 30}
